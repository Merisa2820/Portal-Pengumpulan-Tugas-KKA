<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KKA PORTAL — Pengumpulan Tugas Koding dan Kecerdasan Artifisial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --bg-card: #111827;
      --bg-soft: #1a2332;
      --border: #243044;
      --text: #e5eefb;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #22d3ee;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #a78bfa;
      --radius: 14px;
      --shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 50%),
                  radial-gradient(900px 500px at 100% 0%, #0f766e33 0%, transparent 45%),
                  var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ===== LOGIN ===== */
    #login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--purple));
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      width: 64px; height: 64px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(59,130,246,.4);
    }
    .brand h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
      background: var(--bg-soft);
      padding: 6px;
      border-radius: 12px;
    }
    .role-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 10px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
      font-size: 0.95rem;
    }
    .role-tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(59,130,246,.35);
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border .2s, box-shadow .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,.2);
    }
    .pin-input {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.25em;
      text-align: center;
      font-size: 1.15rem !important;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: .2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      color: white;
      width: 100%;
      box-shadow: 0 6px 20px rgba(59,130,246,.35);
    }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-secondary {
      background: var(--bg-soft);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #243044; }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: #111; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-sm { padding: 7px 12px; font-size: 0.82rem; border-radius: 8px; }
    .btn-icon { padding: 8px 10px; }
    .error-msg {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.35);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 14px;
      display: none;
    }
    .demo-info {
      margin-top: 20px;
      padding: 12px;
      background: rgba(34,211,238,.08);
      border: 1px dashed rgba(34,211,238,.35);
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .demo-info strong { color: var(--accent); }

    /* ===== APP SHELL ===== */
    #app { display: none; min-height: 100vh; }
    .navbar {
      background: rgba(17,24,39,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-logo {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .nav-title { font-weight: 700; font-size: 1.05rem; }
    .nav-sub { font-size: 0.75rem; color: var(--text-muted); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .user-chip {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-soft);
      padding: 6px 12px 6px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--primary));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem;
    }
    .notif-btn {
      position: relative;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text);
      font-size: 1.1rem;
    }
    .notif-badge {
      position: absolute;
      top: -4px; right: -4px;
      background: var(--danger);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      min-width: 18px; height: 18px;
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
    }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 64px);
    }
    .sidebar {
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
    }
    .side-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.92rem;
      margin-bottom: 4px;
      transition: .15s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .side-item:hover { background: var(--bg-soft); color: var(--text); }
    .side-item.active {
      background: rgba(59,130,246,.15);
      color: #93c5fd;
      border: 1px solid rgba(59,130,246,.3);
    }
    .main {
      padding: 24px;
      overflow-x: hidden;
    }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .page-header h2 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .page-header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }

    /* Cards & Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .stat-card .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-card .value { font-size: 1.7rem; font-weight: 800; margin-top: 4px; }
    .stat-card .sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }
    .card-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-success { background: rgba(16,185,129,.15); color: #6ee7b7; }
    .badge-warning { background: rgba(245,158,11,.15); color: #fcd34d; }
    .badge-danger { background: rgba(239,68,68,.15); color: #fca5a5; }
    .badge-info { background: rgba(59,130,246,.15); color: #93c5fd; }
    .badge-purple { background: rgba(167,139,250,.15); color: #c4b5fd; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }
    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 1.1rem; font-weight: 700; }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    /* File upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
      background: var(--bg-soft);
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(59,130,246,.08);
    }
    .upload-zone .icon { font-size: 2rem; margin-bottom: 8px; }
    .file-list { margin-top: 12px; }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-soft);
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 0.88rem;
    }

    /* Notifikasi panel */
    .notif-panel {
      position: absolute;
      top: 52px;
      right: 0;
      width: 340px;
      max-height: 420px;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: none;
      z-index: 60;
    }
    .notif-panel.show { display: block; }
    .notif-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: .15s;
    }
    .notif-item:hover { background: var(--bg-soft); }
    .notif-item.unread { background: rgba(59,130,246,.08); }
    .notif-item .time { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty .icon { font-size: 2.5rem; margin-bottom: 10px; opacity: .6; }

    /* Score input */
    .score-input {
      width: 70px;
      text-align: center;
      font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        display: flex;
        overflow-x: auto;
        padding: 10px;
        gap: 4px;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .side-item { white-space: nowrap; margin-bottom: 0; }
    }

    .hidden { display: none !important; }
    .text-muted { color: var(--text-muted); }
    .text-success { color: #6ee7b7; }
    .text-warning { color: #fcd34d; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 14px; }
    .mb-2 { margin-bottom: 8px; }
    .flex { display: flex; gap: 10px; align-items: center; }
    .flex-wrap { flex-wrap: wrap; }
    .gap-2 { gap: 8px; }
  </style>
</head>

let state = {
  data: null,
  currentUser: null,
  currentRole: null, // 'guru' | 'siswa'
  loginRole: 'siswa',
  activePage: 'dashboard'
};

/* ---------- Storage helpers ---------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      state.data = structuredClone(DEFAULT_DATA);
      saveData();
      return;
    }
    state.data = JSON.parse(raw);
  } catch (e) {
    console.error(e);
    state.data = structuredClone(DEFAULT_DATA);
    saveData();
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
}

function uid(prefix = 'id') {
  return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ---------- Auth ---------- */
function switchRole(role) {
  state.loginRole = role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
  const siswaFields = document.getElementById('siswa-only-fields');
  const kelasField = document.getElementById('siswa-kelas-field');
  if (role === 'siswa') {
    siswaFields.style.display = '';
    kelasField.style.display = '';
  } else {
    siswaFields.style.display = 'none';
    kelasField.style.display = 'none';
  }
  document.getElementById('login-error').style.display = 'none';
}

function handleLogin(e) {
  e.preventDefault();
  const pin = document.getElementById('login-pin').value.trim();
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  if (!/^\d{6}$/.test(pin)) {
    showLoginError('PIN harus 6 digit angka.');
    return;
  }

  if (state.loginRole === 'guru') {
    if (pin === state.data.guru.pin) {
      state.currentUser = { ...state.data.guru };
      state.currentRole = 'guru';
      enterApp();
    } else {
      showLoginError('PIN Guru salah. Coba lagi.');
    }
  } else {
    const nama = document.getElementById('login-nama').value.trim();
    const kelas = document.getElementById('login-kelas').value;
    if (!nama || !kelas) {
      showLoginError('Nama dan Kelas wajib diisi untuk siswa.');
      return;
    }
    // Match by PIN + optional nama/kelas (PIN unique preferred)
    const found = state.data.siswa.find(s => s.pin === pin);
    if (!found) {
      showLoginError('PIN Siswa tidak ditemukan. Hubungi guru untuk didaftarkan.');
      return;
    }
    // Extra safety: if nama/kelas given, they should roughly match (case-insensitive)
    if (found.nama.toLowerCase() !== nama.toLowerCase() || found.kelas !== kelas) {
      showLoginError('Nama / Kelas tidak cocok dengan data PIN. Periksa kembali atau hubungi guru.');
      return;
    }
    state.currentUser = { ...found };
    state.currentRole = 'siswa';
    enterApp();
  }
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function enterApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-name').textContent = state.currentUser.nama;
  document.getElementById('user-role').textContent = state.currentRole === 'guru'
    ? 'Guru Mapel KKA'
    : `Siswa · Kelas ${state.currentUser.kelas}`;
  document.getElementById('user-avatar').textContent = state.currentUser.nama.charAt(0).toUpperCase();
  buildSidebar();
  navigate(state.currentRole === 'guru' ? 'dashboard' : 'siswa-dashboard');
  updateNotifBadge();
}

function logout() {
  state.currentUser = null;
  state.currentRole = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('login-form').reset();
  document.getElementById('login-error').style.display = 'none';
  switchRole('siswa');
}

/* ---------- Navigation ---------- */
function buildSidebar() {
  const side = document.getElementById('sidebar');
  if (state.currentRole === 'guru') {
    side.innerHTML = `
      <button class="side-item active" data-page="dashboard" onclick="navigate('dashboard')">📊 Dashboard</button>
      <button class="side-item" data-page="tugas" onclick="navigate('tugas')">📝 Kelola Tugas</button>
      <button class="side-item" data-page="submissions" onclick="navigate('submissions')">📥 Pengumpulan</button>
      <button class="side-item" data-page="siswa" onclick="navigate('siswa')">👥 Data Siswa</button>
      <button class="side-item" data-page="nilai" onclick="navigate('nilai')">⭐ Nilai &amp; Koreksi</button>
      <button class="side-item" data-page="notifikasi" onclick="navigate('notifikasi')">🔔 Notifikasi</button>
    `;
  } else {
    side.innerHTML = `
      <button class="side-item active" data-page="siswa-dashboard" onclick="navigate('siswa-dashboard')">🏠 Beranda</button>
      <button class="side-item" data-page="siswa-tugas" onclick="navigate('siswa-tugas')">📤 Kirim Tugas</button>
      <button class="side-item" data-page="siswa-nilai" onclick="navigate('siswa-nilai')">📋 Nilai Saya</button>

    `;

}

function navigate(page) {
  state.activePage = page;
  document.querySelectorAll('.side-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  const main = document.getElementById('main-content');
  if (state.currentRole === 'guru') {
    if (page === 'dashboard') main.innerHTML = renderGuruDashboard();
    else if (page === 'tugas') main.innerHTML = renderKelolaTugas();
    else if (page === 'submissions') main.innerHTML = renderSubmissions();
    else if (page === 'siswa') main.innerHTML = renderDataSiswa();
    else if (page === 'nilai') main.innerHTML = renderNilaiKoreksi();
    else if (page === 'notifikasi') main.innerHTML = renderNotifikasiPage();
  } else {
    if (page === 'siswa-dashboard') main.innerHTML = renderSiswaDashboard();
    else if (page === 'siswa-tugas') main.innerHTML = renderSiswaKirimTugas();
    else if (page === 'siswa-nilai') main.innerHTML = renderSiswaNilai();
    else if (page === 'siswa-profil') main.innerHTML = renderSiswaProfil();
  }
}

/* ---------- Notifications ---------- */
function addNotification(title, message, type = 'info') {
  state.data.notifications.unshift({
    id: uid('n'),
    title,
    message,
    type,
    read: false,
    createdAt: new Date().toISOString()
  });
  // keep last 50
  if (state.data.notifications.length > 50) state.data.notifications.length = 50;
  saveData();
  updateNotifBadge();
}

function updateNotifBadge() {
  const unread = state.data.notifications.filter(n => !n.read).length;
  const badge = document.getElementById('notif-badge');
  if (unread > 0) {
    badge.style.display = 'flex';
    badge.textContent = unread > 9 ? '9+' : unread;
  } else {
    badge.style.display = 'none';
  }
}

function toggleNotif() {
  const panel = document.getElementById('notif-panel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) {
    renderNotifPanel();
  }
}

function renderNotifPanel() {
  const panel = document.getElementById('notif-panel');
  const list = state.data.notifications.slice(0, 15);
  if (!list.length) {
    panel.innerHTML = '<div class="empty" style="padding:24px"><div class="icon">🔕</div>Belum ada notifikasi</div>';
    return;
  }
  panel.innerHTML = list.map(n => `
    <div class="notif-item ${n.read ? '' : 'unread'}" onclick="markNotifRead('${n.id}')">
      <div style="font-weight:600;font-size:0.9rem">${escapeHtml(n.title)}</div>
      <div style="font-size:0.82rem;color:var(--text-muted)">${escapeHtml(n.message)}</div>
      <div class="time">${formatDateTime(n.createdAt)}</div>
    </div>
  `).join('') + `<div style="padding:10px;text-align:center"><button class="btn btn-secondary btn-sm" onclick="markAllNotifRead()">Tandai semua dibaca</button></div>`;
}

function markNotifRead(id) {
  const n = state.data.notifications.find(x => x.id === id);
  if (n) n.read = true;
  saveData();
  updateNotifBadge();
  renderNotifPanel();
}

function markAllNotifRead() {
  state.data.notifications.forEach(n => n.read = true);
  saveData();
  updateNotifBadge();
  renderNotifPanel();
}

document.addEventListener('click', (e) => {
  const wrapper = document.getElementById('notif-wrapper');
  if (wrapper && !wrapper.contains(e.target)) {
    document.getElementById('notif-panel')?.classList.remove('show');
  }
});

/* ---------- Helpers ---------- */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, type: file.type, size: file.size, data: reader.result });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function downloadBase64(fileObj) {
  const a = document.createElement('a');
  a.href = fileObj.data;
  a.download = fileObj.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function openModal(title, bodyHtml, footerHtml = '') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = footerHtml;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

  `);
}

function simpanTugas(id) {
  const judul = document.getElementById('f-judul').value.trim();
  const deskripsi = document.getElementById('f-deskripsi').value.trim();
  const deadline = document.getElementById('f-deadline').value;
  if (!judul || !deadline) {
    alert('Judul dan Deadline wajib diisi.');
    return;
  }
  if (id) {
    const t = state.data.tugas.find(x => x.id === id);
    if (t) {
      t.judul = judul;
      t.deskripsi = deskripsi;
      t.deadline = deadline;
    }
  } else {
    state.data.tugas.unshift({
      id: uid('t'),
      judul,
      deskripsi,
      deadline,
      createdAt: new Date().toISOString(),
      aktif: true
    });
    addNotification('Tugas Baru', `Tugas "${judul}" telah dibuat.`, 'info');
  }
  saveData();
  closeModal();
  navigate('tugas');
}

function toggleTugasAktif(id) {
  const t = state.data.tugas.find(x => x.id === id);
  if (t) {
    t.aktif = !t.aktif;
    saveData();
    navigate('tugas');
  }
}

function hapusTugas(id) {
  if (!confirm('Hapus tugas ini? Semua pengumpulan terkait juga akan dihapus.')) return;
  state.data.tugas = state.data.tugas.filter(t => t.id !== id);
  state.data.submissions = state.data.submissions.filter(s => s.tugasId !== id);
  saveData();
  navigate('tugas');
}

  const nilai = parseInt(document.getElementById('f-nilai').value, 10);
  const feedback = document.getElementById('f-feedback').value.trim();
  if (isNaN(nilai) || nilai < 0 || nilai > 100) {

    return;
  }
  const s = state.data.submissions.find(x => x.id === subId);
  if (s) {
    s.nilai = nilai;
    s.feedback = feedback;
    s.gradedAt = new Date().toISOString();
    const siswa = state.data.siswa.find(x => x.id === s.siswaId);
    addNotification('Nilai Diberikan', `${siswa?.nama || 'Siswa'} mendapat nilai ${nilai}`, 'success');

  navigate(state.activePage === 'nilai' ? 'nilai' : 'submissions');

  // PIN uniqueness

  if (dup || (pin === state.data.guru.pin)) {

  if (id) {

    if (s) { s.nama = nama; s.kelas = kelas; s.pin = pin; }

/** Export nilai ke file CSV (bisa dibuka di Excel) */
function exportNilaiCSV(opts = {}) {
  let rows = [...state.data.submissions];

  if (opts.kelas) {
    const ids = state.data.siswa.filter(s => s.kelas === opts.kelas).map(s => s.id);
    rows = rows.filter(s => ids.includes(s.siswaId));
  }
  if (opts.tugasId) {
    rows = rows.filter(s => s.tugasId === opts.tugasId);
  }
  if (opts.hanyaDinilai) {
    rows = rows.filter(s => s.nilai != null);
  }
  if (opts.hanyaBelum) {
    rows = rows.filter(s => s.nilai == null);
  }

  // Sort: kelas → nama → tugas
  rows.sort((a, b) => {
    const sa = state.data.siswa.find(x => x.id === a.siswaId);
    const sb = state.data.siswa.find(x => x.id === b.siswaId);
    const ka = (sa?.kelas || '') + (sa?.nama || '');
    const kb = (sb?.kelas || '') + (sb?.nama || '');
    return ka.localeCompare(kb, 'id');
  });

  if (rows.length === 0) {
    alert('Tidak ada data nilai yang sesuai filter untuk diekspor.');
    return;
  }

  const header = ['No', 'Nama Siswa', 'Kelas', 'Judul Tugas', 'Nilai', 'Feedback', 'Tanggal Kirim', 'Tanggal Dinilai'];
  const csvRows = [header];

  rows.forEach((s, i) => {
    const siswa = state.data.siswa.find(x => x.id === s.siswaId);
    const tugas = state.data.tugas.find(x => x.id === s.tugasId);
    csvRows.push([
      i + 1,
      siswa?.nama || '',
      siswa?.kelas || '',
      tugas?.judul || '',
      s.nilai != null ? s.nilai : '',
      (s.feedback || '').replace(/"/g, '""'),
      formatDateTime(s.submittedAt),
      s.gradedAt ? formatDateTime(s.gradedAt) : ''
    ]);
  });

  // Escape CSV cells
  const csvContent = csvRows.map(row =>
    row.map(cell => {
      const str = String(cell ?? '');
      if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }).join(',')
  ).join('\r\n');

  // BOM for Excel UTF-8
  const bom = '\uFEFF';
  const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0, 10);
  let fname = `Nilai_KKA_${dateStr}`;
  if (opts.kelas) fname += `_Kelas${opts.kelas}`;
  if (opts.hanyaDinilai) fname += '_SudahDinilai';
  if (opts.hanyaBelum) fname += '_BelumDinilai';
  a.href = url;
  a.download = fname + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  addNotification('Export Nilai', `Berhasil mengekspor ${rows.length} baris nilai ke CSV.`, 'success');
  updateNotifBadge();
}

  const files = Array.from(e.target.files || []);
  pendingFiles = pendingFiles.concat(files);

function renderPendingFiles() {
  const list = document.getElementById('file-list');
  if (!list) return;
  list.innerHTML = pendingFiles.map((f, i) => `
    <div class="file-item">
      <span>📄 ${escapeHtml(f.name)} <span class="text-muted">(${(f.size/1024).toFixed(1)} KB)</span></span>

document.addEventListener('DOMContentLoaded', () => {
  // delegated later when zone exists
});
document.body.addEventListener('dragover', e => {
  const zone = document.getElementById('upload-zone');
  if (zone && e.target.closest('#upload-zone')) {
    e.preventDefault();
    zone.classList.add('dragover');
  }
});
document.body.addEventListener('dragleave', e => {
  const zone = document.getElementById('upload-zone');
  if (zone) zone.classList.remove('dragover');
});
document.body.addEventListener('drop', e => {
  const zone = document.getElementById('upload-zone');
  if (zone && e.target.closest('#upload-zone')) {
    e.preventDefault();
    zone.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files || []);
    pendingFiles = pendingFiles.concat(files);
    renderPendingFiles();
  }
});

async function kirimTugasSiswa() {
  const tugasId = document.getElementById('sel-tugas').value;
  const link = document.getElementById('sub-link').value.trim();
  const catatan = document.getElementById('sub-catatan').value.trim();
  if (!tugasId) {
    alert('Pilih tugas terlebih dahulu.');
    return;
  }
  if (!link && pendingFiles.length === 0) {
    alert('Sertakan minimal satu file atau link.');
    return;
  }

  // Convert files to base64 (with size check)
  const fileObjs = [];
  for (const f of pendingFiles) {
    if (f.size > 6 * 1024 * 1024) {
      alert(`File "${f.name}" terlalu besar (maks disarankan 6MB untuk localStorage).`);
      return;
    }
    fileObjs.push(await fileToBase64(f));
  }

  const existing = state.data.submissions.find(
    s => s.siswaId === state.currentUser.id && s.tugasId === tugasId
  );

  if (existing) {
    existing.link = link || existing.link;
    existing.catatan = catatan;
    existing.files = fileObjs.length ? fileObjs : existing.files;
    existing.submittedAt = new Date().toISOString();
    existing.nilai = null; // reset nilai jika update
    existing.feedback = '';
  } else {
    state.data.submissions.push({
      id: uid('sub'),
      siswaId: state.currentUser.id,
      tugasId,
      link: link || '',
      catatan,
      files: fileObjs,
      submittedAt: new Date().toISOString(),
      nilai: null,
      feedback: ''
    });
  }

  const tugas = state.data.tugas.find(t => t.id === tugasId);
  addNotification(
    'Tugas Baru Dikirim',
    `${state.currentUser.nama} (${state.currentUser.kelas}) mengirim "${tugas?.judul || 'tugas'}"`,
    'info'
  );
  saveData();
  pendingFiles = [];
  alert('Tugas berhasil dikirim!');
  navigate('siswa-tugas');
}

                  <td style="max-width:280px">${escapeHtml(s.feedback || '—')}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}
